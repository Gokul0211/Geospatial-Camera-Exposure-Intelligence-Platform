server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing: send all non-asset requests to index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── /api proxy → backend container ───────────────────────────────────────
    # This is the production equivalent of Vite's devServer.proxy config.
    # In development: Vite proxies /api → http://127.0.0.1:8000
    # In Docker:      nginx proxies /api → http://backend:8000 (compose service name)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket upgrade support (for /api/ws/alerts)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;  # keep WS connections alive
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
